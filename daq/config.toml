# Acquisition config for the SpectraQuest IM fault rig (see GUIDEBOOK.md, IM_DAQ_equipment_info.md).
# Items marked TODO(onsite) are open items — verify and edit on site.
#
# Device names: NI MAX (or `python daq/daq_check.py add <IP> cDAQ1`) names the chassis cDAQ1 and
# its module cDAQ1Mod1. If NI MAX picked another name, rename it there or edit `device` below.
# `sim_device` is used instead when a script runs with --sim.
#
# The rig has ONE cDAQ-9191 (S/N 1D92246). It is single-slot and holds the BNC/IEPE module for
# vibration + current, so [temp] (thermocouple module) is disabled.

[vib]                                   # cDAQ-9191 S/N 1D92246, BNC/IEPE module
device = "cDAQ1Mod1"
sim_device = "SimDAQ1Mod1"
expected_module = "NI 9230 (BNC)"       # confirmed via DAQmx 2026-10-15, S/N 1D7B014
sample_rate = 12800.0                   # NI 9230 max is 12.8 kS/s/ch (3 ch, simultaneous)

[[vib.channels]]
name = "accel_de_radial"                # Kistler 8702B25 SN 5460544
kind = "accel"
physical = "ai0"                        # confirmed 2026-10-15 with motor running
sensitivity_mV_per_g = 200.0            # TODO(onsite): value from calibration certificate
range_g = 25.0
iepe_current_A = 0.004                  # NI 9230 IEPE excitation is 0 or 4 mA only
coupling = "AC"
location = "motor housing, drive end, radial"

[[vib.channels]]
name = "motor_current"                  # clamp on one motor supply lead
kind = "current_clamp"
physical = "ai2"                        # confirmed 2026-10-15 with motor running (ai1 empty)
sensitivity_mV_per_A = 100.0            # TODO(onsite): 10 or 100 mV/A — clamp label / range switch
range_V = 5.0
coupling = "DC"
location = "motor supply lead (phase TODO)"

[motor]                                 # used by the signal checks (daq/checks.py, sampling console)
poles = 2                               # Marathon 1/2 HP, 3450 rpm at 60 Hz -> 2-pole
current_rms_A = [0.3, 4.0]              # plausible clamp reading (FLA 2-2.2 A); ~10x out points at a wrong mV/A
line_hz = 60.0

[temp]                                  # optional thermocouple module — not in the current setup
enabled = false                         # set true only if a thermocouple module is connected
device = "TCMod1"                       # DAQmx name of that module (as shown in NI MAX)
sim_device = "SimDAQ2Mod1"
expected_module = "NI 9211"             # TODO(onsite): 9211 / 9212 / 9213?
rate_hz = 1.0                           # software-timed reads; 1-10 Hz is plenty

[[temp.channels]]
name = "motor_housing"
physical = "ai0"                        # TODO(onsite)
tc_type = "K"                           # TODO(onsite): K = yellow plug, yellow(+)/red(-) leads (ANSI); green plug (IEC)
min_C = 0.0
max_C = 150.0
location = "motor housing surface (taped)"
