; Simulated hardware matching the test rig, for testing the software before going onsite.
;   Linux:   nidaqmxconfig --import setup/sim_devices.ini
;   Windows: NI MAX > File > Import > this file (edit Major/MinorVersion if DAQmx is not 26.5)
; SimDAQ1 stands in for the rig's single cDAQ-9191 with its BNC module (best guess NI 9234, see
; IM_DAQ_equipment_info.md §4); edit ProductType if the real module turns out different.
; SimDAQ2 (NI 9211) exists only to test the optional [temp] code path; there is no such real device.
; Simulated devices do not interfere with the real ones.
; The chassis is a simulated USB cDAQ-9171: a simulated cDAQ-9191 imports but cannot run tasks
; (error -88705, it has no network peer). Task code is the same for either chassis.
; To re-import from scratch (wipes ALL DAQmx config, incl. added real chassis):
;   nidaqmxconfig --import setup/sim_devices.ini --eraseconfig
[DAQmx]
MajorVersion = 26
MinorVersion = 5

[DAQmxCDAQChassis SimDAQ1]
ProductType = cDAQ-9171
DevSerialNum = 0x0
DevIsSimulated = 1

[DAQmxCDAQModule SimDAQ1Mod1]
ProductType = NI 9234
DevSerialNum = 0x0
DevIsSimulated = 1
CompactDAQ.ChassisDevName = SimDAQ1
CompactDAQ.SlotNum = 1

[DAQmxCDAQChassis SimDAQ2]
ProductType = cDAQ-9171
DevSerialNum = 0x0
DevIsSimulated = 1

[DAQmxCDAQModule SimDAQ2Mod1]
ProductType = NI 9211
DevSerialNum = 0x0
DevIsSimulated = 1
CompactDAQ.ChassisDevName = SimDAQ2
CompactDAQ.SlotNum = 1
